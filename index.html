<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Московский Политех</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; background: #000; }
  body { overflow-x: hidden; }

  .scroll-scene {
    height: 340vh;
    position: relative;
    background: #000;
  }

  .sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: #000;
  }

  #stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.45);
    font: 11px/1 Arial, sans-serif;
    letter-spacing: .25em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 1;
    transition: opacity .25s ease;
  }

  /* =========================
     ИНТЕРАКТИВНОЕ МЕНЮ ПОСЛЕ 2 СЦЕН
  ========================== */
  .menu-screen {
    min-height: 100vh;
    width: 100%;
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 75% 30%, rgba(236, 67, 88, .11), transparent 25%),
      radial-gradient(circle at 18% 78%, rgba(126, 89, 255, .10), transparent 28%),
      #000;
    padding: 80px 6vw;
  }

  .menu-screen::before,
  .menu-screen::after {
    content: "";
    position: absolute;
    width: 42vw;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff315a, #8858ff, transparent);
    opacity: .7;
    transform: rotate(45deg);
    pointer-events: none;
  }

  .menu-screen::before {
    right: -12vw;
    top: 12vh;
  }

  .menu-screen::after {
    left: -14vw;
    bottom: 12vh;
  }

  .menu-wrap {
    width: min(1120px, 100%);
    position: relative;
    z-index: 2;
  }

  .menu-kicker {
    color: #ef465b;
    font: 600 12px/1 Arial, sans-serif;
    letter-spacing: .38em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .menu-title {
    color: #fff;
    font: 800 clamp(42px, 7vw, 100px)/.92 Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: -.04em;
    max-width: 900px;
  }

  .menu-subtitle {
    margin-top: 24px;
    color: rgba(255,255,255,.56);
    font: 400 15px/1.6 Arial, sans-serif;
    letter-spacing: .08em;
    max-width: 620px;
  }

  .menu-grid {
    margin-top: 58px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border-top: 1px solid rgba(255,255,255,.18);
    border-left: 1px solid rgba(255,255,255,.18);
  }

  .menu-btn {
    min-height: 150px;
    position: relative;
    border: 0;
    border-right: 1px solid rgba(255,255,255,.18);
    border-bottom: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.012);
    color: #fff;
    text-align: left;
    padding: 28px 32px;
    cursor: pointer;
    overflow: hidden;
    transition:
      background .3s ease,
      transform .3s ease,
      color .3s ease;
  }

  .menu-btn::before {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 4px;
    background: linear-gradient(90deg, #ff315a, #8a58ff);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }

  .menu-btn::after {
    content: "↗";
    position: absolute;
    top: 25px;
    right: 30px;
    font-size: 27px;
    color: rgba(255,255,255,.45);
    transition: transform .3s ease, color .3s ease;
  }

  .menu-btn:hover,
  .menu-btn:focus-visible {
    background: rgba(255,255,255,.065);
    outline: none;
  }

  .menu-btn:hover::before,
  .menu-btn:focus-visible::before {
    transform: scaleX(1);
  }

  .menu-btn:hover::after,
  .menu-btn:focus-visible::after {
    transform: translate(5px,-5px);
    color: #ff5369;
  }

  .menu-index {
    display: block;
    color: #ef465b;
    font: 700 11px/1 Arial, sans-serif;
    letter-spacing: .25em;
    margin-bottom: 24px;
  }

  .menu-label {
    display: block;
    font: 700 clamp(24px, 2.8vw, 42px)/1 Arial, sans-serif;
    text-transform: uppercase;
  }

  /* Модальное окно при клике на кнопку */
  .book-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(0,0,0,.86);
    backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
  }

  .book-modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .book-modal-card {
    width: min(760px, 100%);
    border: 1px solid rgba(255,255,255,.2);
    background: #080808;
    padding: clamp(28px, 5vw, 58px);
    position: relative;
    transform: translateY(18px) scale(.985);
    transition: transform .28s ease;
  }

  .book-modal.open .book-modal-card {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    right: 20px;
    top: 16px;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }

  .modal-close:hover {
    background: #ef465b;
    transform: rotate(90deg);
  }

  .modal-number {
    color: #ef465b;
    font: 700 12px/1 Arial, sans-serif;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  .modal-title {
    margin-top: 22px;
    font: 800 clamp(38px, 6vw, 70px)/.95 Arial, sans-serif;
    text-transform: uppercase;
    color: #f2e9ff;
    text-shadow:
      0 0 18px rgba(239, 70, 91, .08),
      0 0 30px rgba(138, 88, 255, .05);
  }

  .modal-copy {
    margin-top: 26px;
    max-width: 600px;
    color: rgba(255,255,255,.66);
    font: 400 16px/1.7 Arial, sans-serif;
  }

  @media (max-width: 720px) {
    .menu-grid { grid-template-columns: 1fr; }
    .menu-btn { min-height: 125px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-scene { height: 200vh; }
    *, *::before, *::after { scroll-behavior: auto !important; }
  }

  html, body { background: #0b0b0b; }
  body { font-family: Arial, sans-serif; }
  .scroll-scene { background: #0b0b0b; height: 340svh; }
  .sticky { width: 100%; height: 100svh; background: #0b0b0b; }
  .hint { bottom: max(20px, env(safe-area-inset-bottom)); font-size: 10px;
    letter-spacing: .18em; white-space: nowrap; color: rgba(255,255,255,.65); }
  .menu-title, .modal-title { overflow-wrap: anywhere; }
  .book-modal-card { max-height: calc(100dvh - 48px); overflow-y: auto; }
  .modal-title { padding-right: 12px; }
  .modal-close:focus-visible { outline: 2px solid #f2e9ff; outline-offset: 4px; }
  @media (min-width: 721px) and (max-width: 1100px) {
    .menu-screen { padding: 64px 5vw; }
    .menu-title { font-size: clamp(52px, 8vw, 82px); }
    .menu-btn { padding: 26px; min-height: 140px; }
  }
  @media (max-width: 720px) {
    .scroll-scene { height: 290svh; }
    .menu-screen { padding: 64px 24px; min-height: 100svh; }
    .menu-title { font-size: clamp(34px, 9.5vw, 64px); line-height: 1; }
    .menu-kicker { letter-spacing: .18em; font-size: 10px; line-height: 1.6; }
    .menu-subtitle { font-size: 14px; letter-spacing: .02em; margin-top: 20px; }
    .menu-grid { margin-top: 32px; }
    .menu-btn { padding: 22px 24px; min-height: 112px; }
    .menu-index { margin-bottom: 16px; }
    .menu-label { font-size: clamp(23px, 6.5vw, 32px); padding-right: 24px; }
    .book-modal { padding: 16px; }
    .book-modal-card { padding: 64px 24px 32px; max-height: calc(100dvh - 32px); }
    .modal-title { font-size: clamp(30px, 9vw, 48px); }
    .modal-copy { font-size: 15px; line-height: 1.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-scene { height: 220svh; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

<body>

<section class="scroll-scene" id="scrollScene">
  <div class="sticky">
    <canvas id="stage" role="img" aria-label="Московский Политех — юбилейная книга, 80 лет. Листайте вниз, чтобы перейти к разделам."></canvas>
    <div class="hint" id="hint">Листайте вниз</div>
  </div>
</section>

<section class="menu-screen" id="bookMenu">
  <div class="menu-wrap">
    <div class="menu-kicker">Электронная книга. </div>
    <h2 class="menu-title">Московский Политех в лицах</h2>
    <p class="menu-subtitle">
      История, люди и события Московского Политеха. Выберите раздел электронной книги.
    </p>

    <div class="menu-grid">
      <button class="menu-btn" data-index="01" data-title="История" data-copy="Хронология становления Московского Политеха, ключевые даты и этапы развития университета.">
        <span class="menu-index">01</span>
        <span class="menu-label">История</span>
      </button>

      <button class="menu-btn" data-index="02" data-title="Люди" data-copy="Преподаватели, выпускники, студенты и герои, которые создавали историю университета.">
        <span class="menu-index">02</span>
        <span class="menu-label">Люди</span>
      </button>

      <button class="menu-btn" data-index="03" data-title="Хронология" data-copy="Интерактивная временная шкала событий — от основания до юбилейного 2027 года.">
        <span class="menu-index">03</span>
        <span class="menu-label">Хронология</span>
      </button>

      <button class="menu-btn" data-index="04" data-title="Галерея" data-copy="Фотографии, архивные материалы и визуальная история поколений Московского Политеха.">
        <span class="menu-index">04</span>
        <span class="menu-label">Галерея</span>
      </button>
    </div>
  </div>
</section>

<div class="book-modal" id="bookModal" aria-hidden="true">
  <div class="book-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div class="modal-number" id="modalNumber">01</div>
    <h3 class="modal-title" id="modalTitle">История</h3>
    <p class="modal-copy" id="modalCopy"></p>
  </div>
</div>

<script>
(() => {
  const scene = document.getElementById('scrollScene');
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hint = document.getElementById('hint');

  const img1 = new Image();
  const img2 = new Image();
  img1.src = 'scene-1.png';
  img2.src = 'scene-2.png';
  let ready = false;
  let dpr = 1;
  let vw = 0;
  let vh = 0;

  // Исходные точки из правого нижнего паттерна первой картинки.
  let sourceSamples = [];
  // Целевые точки из реальной S-образной ленты второй картинки.
  let targetSamples = [];
  let particles = [];

  const PARTICLE_COUNT = window.innerWidth < 600 ? 700 : 1500;

  // Детерминированный random, чтобы анимация всегда выглядела одинаково.
  let seed = 872341;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function smooth(t) {
    t = clamp(t);
    return t * t * (3 - 2 * t);
  }

  function smoother(t) {
    t = clamp(t);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  function range(v, a, b) {
    return clamp((v - a) / (b - a));
  }

  // Первая сцена: без растяжения, сохраняем квадратный референс.
  function sourceRect(iw, ih, cw, ch) {
    const size = Math.min(cw, ch);
    const s = size / iw;
    return {
      x: (cw - size) / 2,
      y: (ch - size) / 2,
      w: size,
      h: size,
      s
    };
  }

  // Вторая сцена остаётся полноэкранной.
  function targetRect(iw, ih, cw, ch) {
    if (cw / ch < 1.1) {
      const scale = Math.min((cw - 24) / 780, ch * .73 / ih);
      return {x: (cw - 780 * scale) / 2 - 500 * scale,
        y: (ch - ih * scale) / 2 + ch * .08,
        w: iw * scale, h: ih * scale, sx: scale, sy: scale};
    }
    const scale = Math.min(cw / iw, ch / ih);
    return {x: (cw - iw * scale) / 2, y: (ch - ih * scale) / 2,
      w: iw * scale, h: ih * scale, sx: scale, sy: scale};
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = canvas.parentElement.clientWidth;
    vh = canvas.parentElement.clientHeight;

    canvas.width = Math.floor(vw * dpr);
    canvas.height = Math.floor(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (ready) buildParticles();
    render();
  }

  // Снимаем пиксельные образцы из референсов.
  function extractSamples() {
    sourceSamples = extractSource(img1);
    targetSamples = extractTarget(img2);

    // если браузер вдруг дал слишком мало точек — fallback
    if (sourceSamples.length < 300 || targetSamples.length < 300) {
      console.warn('Мало точек маски:', sourceSamples.length, targetSamples.length);
    }
  }

  function extractSource(img) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0);

    const data = x.getImageData(0, 0, c.width, c.height).data;
    const pts = [];

    // Берем только область кругового паттерна справа снизу,
    // чтобы не захватить диагональные линии и логотип.
    const x0 = Math.floor(c.width * .55);
    const y0 = Math.floor(c.height * .53);

    for (let yy = y0; yy < c.height; yy += 3) {
      for (let xx = x0; xx < c.width; xx += 3) {
        const k = (yy * c.width + xx) * 4;
        const r = data[k];
        const g = data[k + 1];
        const b = data[k + 2];

        const brightness = (r + g + b) / 3;
        const redish = r > 135 && r > g * 1.08;
        const whiteish = brightness > 175;

        // Игнорируем почти черный фон.
        if (whiteish || redish) {
          pts.push({
            x: xx,
            y: yy,
            r, g, b
          });
        }
      }
    }
    return pts;
  }

  function extractTarget(img) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0);

    const data = x.getImageData(0, 0, c.width, c.height).data;
    const pts = [];

    for (let yy = 0; yy < c.height; yy += 3) {
      for (let xx = 0; xx < c.width; xx += 3) {
        // Исключаем текст "МОСКОВСКИЙ ПОЛИТЕХ / в лицах"
        const inRightTitle =
          xx > c.width * .72 &&
          xx < c.width * .99 &&
          yy > c.height * .25 &&
          yy < c.height * .58;

        // Исключаем маленький знак "80 / 2027" слева.
        const inLeftLogo =
          xx > c.width * .14 &&
          xx < c.width * .34 &&
          yy > c.height * .38 &&
          yy < c.height * .70;

        // Исключаем красную точку снизу — она остается частью фонового референса.
        const inRedDot =
          xx > c.width * .56 &&
          xx < c.width * .64 &&
          yy > c.height * .84;

        if (inRightTitle || inLeftLogo || inRedDot) continue;

        const k = (yy * c.width + xx) * 4;
        const r = data[k];
        const g = data[k + 1];
        const b = data[k + 2];
        const brightness = (r + g + b) / 3;

        // Серая/белая лента на черном фоне.
        // Берем нейтральные светлые пиксели.
        const neutral = Math.max(r,g,b) - Math.min(r,g,b) < 34;

        if (brightness > 70 && neutral) {
          pts.push({
            x: xx,
            y: yy,
            r, g, b
          });
        }
      }
    }
    return pts;
  }

  function chooseSamples(arr, n) {
    if (!arr.length) return [];
    const out = [];
    for (let i = 0; i < n; i++) {
      // равномерная выборка с небольшим детерминированным разбросом
      const t = (i + rand() * .85) / n;
      const idx = Math.min(arr.length - 1, Math.floor(t * arr.length));
      out.push(arr[idx]);
    }
    return out;
  }

  function buildParticles() {
    if (!ready || !sourceSamples.length || !targetSamples.length) return;

    seed = 872341;

    const src = chooseSamples(sourceSamples, PARTICLE_COUNT);
    const dst = chooseSamples(targetSamples, PARTICLE_COUNT);

    const r1 = sourceRect(img1.naturalWidth, img1.naturalHeight, vw, vh);
    const r2 = targetRect(img2.naturalWidth, img2.naturalHeight, vw, vh);

    // Сортировка помогает не делать слишком хаотичные пересечения:
    // исходные точки — по углу вокруг центра паттерна,
    // целевые — сначала сверху вниз, затем слева направо.
    const sCx = img1.naturalWidth * .82;
    const sCy = img1.naturalHeight * .78;

    src.sort((a,b) => {
      const aa = Math.atan2(a.y-sCy, a.x-sCx);
      const bb = Math.atan2(b.y-sCy, b.x-sCx);
      if (Math.abs(aa-bb) > .02) return aa-bb;
      return Math.hypot(a.x-sCx,a.y-sCy) - Math.hypot(b.x-sCx,b.y-sCy);
    });

    dst.sort((a,b) => {
      if (Math.abs(a.y-b.y) > 5) return a.y-b.y;
      return a.x-b.x;
    });

    particles = src.map((s, i) => {
      const t = dst[i % dst.length];

      return {
        sx: r1.x + s.x * r1.s,
        sy: r1.y + s.y * r1.s,

        tx: r2.x + t.x * r2.sx,
        ty: r2.y + t.y * r2.sy,

        sr: s.r, sg: s.g, sb: s.b,
        tr: t.r, tg: t.g, tb: t.b,

        // Чтобы точки не начинали все одновременно.
        delay: rand() * .18,

        // Размер точки зависит от масштаба макета.
        sizeA: lerp(1.8, 4.7, rand()) * Math.max(.7, r1.s),
        sizeB: lerp(.75, 1.8, rand()) * Math.max(.7, Math.sqrt(r2.sx * r2.sy))
      };
    });
  }

  const stripeEdges = [{"edge": "top", "a": 762, "b": 771, "slope": 0.885, "color": [200, 45, 129]}, {"edge": "top", "a": 794, "b": 808, "slope": 0.885, "color": [182, 51, 147]}, {"edge": "top", "a": 830, "b": 843, "slope": 0.885, "color": [177, 57, 172]}, {"edge": "top", "a": 867, "b": 881, "slope": 0.885, "color": [161, 64, 193]}, {"edge": "top", "a": 1011, "b": 1024, "slope": 0.885, "color": [149, 72, 209]}, {"edge": "top", "a": 1046, "b": 1060, "slope": 0.885, "color": [149, 74, 218]}, {"edge": "top", "a": 1082, "b": 1099, "slope": 0.885, "color": [145, 72, 213]}, {"edge": "top", "a": 1120, "b": 1134, "slope": 0.885, "color": [151, 70, 206]}, {"edge": "top", "a": 1156, "b": 1168, "slope": 0.885, "color": [150, 72, 207]}, {"edge": "top", "a": 1194, "b": 1207, "slope": 0.885, "color": [146, 73, 208]}, {"edge": "top", "a": 1227, "b": 1243, "slope": 0.885, "color": [147, 73, 213]}, {"edge": "top", "a": 1264, "b": 1280, "slope": 0.885, "color": [146, 72, 215]}, {"edge": "right", "a": 0, "b": 18, "slope": 0.885, "color": [142, 73, 211]}, {"edge": "right", "a": 41, "b": 59, "slope": 0.885, "color": [145, 72, 212]}, {"edge": "right", "a": 82, "b": 96, "slope": 0.885, "color": [147, 69, 206]}, {"edge": "right", "a": 125, "b": 142, "slope": 0.885, "color": [145, 71, 216]}, {"edge": "right", "a": 164, "b": 181, "slope": 0.885, "color": [146, 72, 214]}, {"edge": "right", "a": 203, "b": 225, "slope": 0.885, "color": [145, 72, 206]}, {"edge": "right", "a": 246, "b": 265, "slope": 0.885, "color": [149, 69, 215]}, {"edge": "right", "a": 286, "b": 306, "slope": 0.885, "color": [144, 72, 207]}, {"edge": "right", "a": 447, "b": 470, "slope": 0.885, "color": [203, 45, 129]}, {"edge": "right", "a": 489, "b": 510, "slope": 0.885, "color": [223, 29, 101]}, {"edge": "right", "a": 529, "b": 552, "slope": 0.885, "color": [236, 21, 83]}, {"edge": "right", "a": 572, "b": 584, "slope": 0.885, "color": [238, 17, 57]}, {"edge": "right", "a": 611, "b": 618, "slope": 0.885, "color": [229, 8, 47]}, {"edge": "bottom", "a": 0, "b": 8, "slope": 0.742, "color": [142, 72, 213]}, {"edge": "bottom", "a": 26, "b": 42, "slope": 0.742, "color": [141, 71, 208]}, {"edge": "bottom", "a": 61, "b": 75, "slope": 0.742, "color": [143, 73, 211]}, {"edge": "bottom", "a": 95, "b": 106, "slope": 0.742, "color": [145, 71, 212]}, {"edge": "bottom", "a": 131, "b": 143, "slope": 0.742, "color": [145, 74, 204]}, {"edge": "bottom", "a": 163, "b": 176, "slope": 0.742, "color": [149, 72, 207]}, {"edge": "bottom", "a": 195, "b": 212, "slope": 0.742, "color": [145, 72, 211]}, {"edge": "bottom", "a": 231, "b": 245, "slope": 0.742, "color": [148, 68, 210]}, {"edge": "bottom", "a": 265, "b": 277, "slope": 0.742, "color": [148, 71, 212]}, {"edge": "bottom", "a": 398, "b": 412, "slope": 0.742, "color": [154, 61, 175]}, {"edge": "bottom", "a": 433, "b": 446, "slope": 0.742, "color": [167, 56, 161]}, {"edge": "bottom", "a": 466, "b": 479, "slope": 0.742, "color": [182, 54, 154]}, {"edge": "bottom", "a": 500, "b": 509, "slope": 0.742, "color": [190, 52, 136]}, {"edge": "left", "a": 557, "b": 564, "slope": 0.742, "color": [237, 10, 48]}, {"edge": "left", "a": 596, "b": 609, "slope": 0.742, "color": [246, 17, 59]}, {"edge": "left", "a": 632, "b": 656, "slope": 0.742, "color": [239, 20, 80]}, {"edge": "left", "a": 677, "b": 701, "slope": 0.742, "color": [225, 27, 99]}, {"edge": "left", "a": 722, "b": 748, "slope": 0.742, "color": [213, 38, 128]}, {"edge": "left", "a": 905, "b": 927, "slope": 0.742, "color": [145, 71, 212]}, {"edge": "left", "a": 949, "b": 971, "slope": 0.742, "color": [144, 71, 205]}, {"edge": "left", "a": 993, "b": 1019, "slope": 0.742, "color": [148, 69, 207]}, {"edge": "left", "a": 1043, "b": 1063, "slope": 0.742, "color": [142, 69, 207]}, {"edge": "left", "a": 1087, "b": 1105, "slope": 0.742, "color": [146, 71, 211]}, {"edge": "left", "a": 1137, "b": 1153, "slope": 0.742, "color": [143, 71, 208]}, {"edge": "left", "a": 1179, "b": 1199, "slope": 0.742, "color": [144, 71, 214]}, {"edge": "left", "a": 1225, "b": 1246, "slope": 0.742, "color": [144, 69, 213]}, {"edge": "left", "a": 1269, "b": 1280, "slope": 0.742, "color": [148, 69, 205]}];
  function drawFirstScene(img, alpha) {
    if (alpha <= 0) return;
    const r = sourceRect(img.naturalWidth, img.naturalHeight, vw, vh);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#0b0b0b';
    ctx.fillRect(0, 0, vw, vh);
    // Extend only stripes actually touching the source border. Their boundary
    // widths and colours come directly from the supplied image.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, vw, vh);
    ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip('evenodd');
    const reach = (vw + vh) * 2 / r.s;
    for (const e of stripeEdges) {
      let x1, y1, x2, y2, dx, dy;
      if (e.edge === 'top' || e.edge === 'bottom') {
        x1=e.a; x2=e.b;
        y1=y2=e.edge === 'top' ? 0 : 1280;
        dy=e.edge === 'top' ? -reach : reach; dx=dy*e.slope;
      } else {
        y1=e.a; y2=e.b;
        x1=x2=e.edge === 'left' ? 0 : 1280;
        dx=e.edge === 'left' ? -reach : reach; dy=dx/e.slope;
      }
      ctx.fillStyle=`rgb(${e.color.join(',')})`;
      ctx.beginPath();
      ctx.moveTo(r.x+x1*r.s, r.y+y1*r.s);
      ctx.lineTo(r.x+x2*r.s, r.y+y2*r.s);
      ctx.lineTo(r.x+(x2+dx)*r.s, r.y+(y2+dy)*r.s);
      ctx.lineTo(r.x+(x1+dx)*r.s, r.y+(y1+dy)*r.s);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.drawImage(img, r.x, r.y, r.w, r.h);
    ctx.restore();
  }

  function drawSecondScene(img, alpha) {
    if (alpha <= 0) return;
    const r = targetRect(img.naturalWidth, img.naturalHeight, vw, vh);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle='#020202'; ctx.fillRect(0,0,vw,vh);
    if (vw / vh < 1.1) {
      ctx.drawImage(img, 500, 0, 780, 640,
        r.x+500*r.sx, r.y, 780*r.sx, r.h);
      const badge = Math.min(120, vw * .27);
      ctx.drawImage(img, 245, 285, 145, 120, 24, Math.max(24, vh*.09), badge, badge*120/145);
    } else ctx.drawImage(img, r.x, r.y, r.w, r.h);
    ctx.restore();
  }

  function drawParticles(p) {
    // Морф начинается после небольшой паузы.
    const m0 = range(p, .16, .78);

    // На самом старте точки почти точно лежат поверх паттерна референса.
    // В конце они сходятся к реальному S-паттерну второй картинки.
    for (let i = 0; i < particles.length; i++) {
      const q = particles[i];
      const local = smoother(clamp((m0 - q.delay) / (1 - q.delay)));

      // "Падение": в середине добавляем небольшой вертикальный провис.
      const arc = Math.sin(local * Math.PI);
      const fall = arc * (28 + (i % 17));

      const x = lerp(q.sx, q.tx, local);
      const y = lerp(q.sy, q.ty, local) + fall;

      const rr = Math.round(lerp(q.sr, q.tr, local));
      const gg = Math.round(lerp(q.sg, q.tg, local));
      const bb = Math.round(lerp(q.sb, q.tb, local));
      const size = lerp(q.sizeA, q.sizeB, local);

      // Паттерн слегка "рассыпается" в середине.
      const alpha = 0.82 + 0.18 * Math.cos(local * Math.PI * 2);

      ctx.beginPath();
      ctx.arc(x, y, Math.max(.6, size), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.fill();
    }
  }

  function getProgress() {
    const rect = scene.getBoundingClientRect();
    const max = scene.offsetHeight - vh;
    if (max <= 0) return 0;
    return clamp(-rect.top / max);
  }

  function render() {
    if (!ready) return;

    const p = getProgress();

    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b0b0b';
    ctx.fillRect(0, 0, vw, vh);

    /*
      0.00–0.18: первая картинка 1:1.
      0.18–0.64: первая уходит, идет particle morph.
      0.58–1.00: проявляется вторая картинка 1:1.
    */
    const fade1 = 1 - smooth(range(p, .20, .58));
    const fade2 = smooth(range(p, .56, .88));

    drawFirstScene(img1, fade1);

    // Во время перехода затемняем фон, чтобы частицы были хорошо видны.
    if (p > .14 && p < .90) {
      const dark = Math.sin(range(p, .14, .90) * Math.PI) * .38;
      ctx.fillStyle = `rgba(0,0,0,${dark})`;
      ctx.fillRect(0, 0, vw, vh);
    }

    if (p > .11 && p < .91) {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) drawParticles(p);
    }

    drawSecondScene(img2, fade2);

    ctx.restore();

    hint.style.opacity = String(1 - range(p, .02, .12));
  }

  let framePending = false;
  function tick() {
    if (framePending) return;
    framePending = true;
    requestAnimationFrame(() => {framePending = false; render();});
  }
  window.addEventListener('scroll', tick, { passive: true });
  window.addEventListener('pageshow', tick);


  Promise.all([
    img1.decode(),
    img2.decode()
  ]).then(() => {
    extractSamples();
    ready = true;
    resize();
    buildParticles();
    tick();
  }).catch(() => { hint.textContent = 'Не удалось загрузить изображение. Обновите страницу.'; });

  const modal = document.getElementById('bookModal');
  const modalClose = document.getElementById('modalClose');
  const modalNumber = document.getElementById('modalNumber');
  const modalTitle = document.getElementById('modalTitle');
  const modalCopy = document.getElementById('modalCopy');

  let lastFocus;
  modal.inert = true;
  function openBookModal(button) {
    lastFocus = button;
    modal.inert = false;
    document.getElementById("bookMenu").inert = true;
    modalNumber.textContent = button.dataset.index || '';
    modalTitle.textContent = button.dataset.title || '';
    modalCopy.textContent = button.dataset.copy || '';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }

  function closeBookModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.getElementById('bookMenu').inert = false;
    if (lastFocus) lastFocus.focus();
    modal.inert = true;
  }

  document.querySelectorAll('.menu-btn').forEach(button => {
    button.addEventListener('click', () => openBookModal(button));
  });

  modalClose.addEventListener('click', closeBookModal);

  modal.addEventListener('click', (event) => {
    if (event.target === modal) closeBookModal();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Tab' && modal.classList.contains('open')) { event.preventDefault(); modalClose.focus(); }
    if (event.key === 'Escape' && modal.classList.contains('open')) {
      closeBookModal();
    }
  });
